            var pstIdx = isW ? i : (63 - i);
            var bonus = PST[type] ? PST[type][pstIdx] : 0;
            if (isW) score += (base + bonus);
            else score -= (base + bonus);
        }
        return score / 100.0; // In pawns from White's perspective
    }

    function initStockfishWorker() {
        try {
            var blobCode = "importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');";
            var blob = new Blob([blobCode], { type: 'application/javascript' });
            sfWorker = new Worker(URL.createObjectURL(blob));

            sfWorker.onmessage = function(e) {
                var line = typeof e.data === 'string' ? e.data : '';
                if (!line) return;

                if (line === 'uciok' || line === 'readyok') {
                    sfReady = true;
                    processNextEngineTask();
                    return;
                }

                if (!activeEngineTask) return;

                // Parse info score & PV line
                if (line.indexOf('info ') === 0 && line.indexOf(' score ') !== -1) {
                    var scoreMatch = line.match(/score (cp|mate) (-?\d+)/);
                    var pvMatch = line.match(/ pv ([a-h][1-8][a-h][1-8][qrbn]?.*)/);
                    if (scoreMatch) {
                        var type = scoreMatch[1];
                        var val = parseInt(scoreMatch[2], 10);
                        // Stockfish reports score from side-to-move's perspective
                        var turnMul = (activeEngineTask.turn === 'white') ? 1 : -1;
                        if (type === 'cp') {
                            activeEngineTask.lastScore = (val * turnMul) / 100.0;
                            activeEngineTask.mateIn = null;
                        } else if (type === 'mate') {
                            activeEngineTask.mateIn = val * turnMul;
                            activeEngineTask.lastScore = (val * turnMul > 0) ? 99.0 : -99.0;
                        }
                    }
                    if (pvMatch) {
                        activeEngineTask.lastPv = pvMatch[1];
                    }
                }

                // Parse bestmove completion
                if (line.indexOf('bestmove ') === 0) {
                    var parts = line.split(' ');
                    var bestUci = parts[1];
                    var finishedTask = activeEngineTask;
                    activeEngineTask = null;
                    if (finishedTask.callback) {
                        finishedTask.callback(bestUci, finishedTask.lastScore, finishedTask.mateIn, finishedTask.lastPv);
                    }
                    processNextEngineTask();
                }
            };

            sfWorker.onerror = function() {
                sfReady = false;
                sfWorker = null;
            };

            sfWorker.postMessage('uci');
            sfWorker.postMessage('isready');
        } catch (err) {
            sfReady = false;
            sfWorker = null;
        }
    }

    function enqueueEngineTask(task) {
        // Cancel redundant non-AI tasks if queue builds up
        if (task.kind !== 'ai_move') {
            engineQueue = engineQueue.filter(function(t) { return t.kind !== task.kind; });
        }
        engineQueue.push(task);
        processNextEngineTask();
    }

    function processNextEngineTask() {
        if (activeEngineTask || engineQueue.length === 0) return;
        var nextTask = engineQueue.shift();

        if (!sfWorker || !sfReady) {
            // Instant local fallback if offline or Worker blocked
            runFallbackEngineTask(nextTask);
            processNextEngineTask();
            return;
        }

        activeEngineTask = nextTask;
        activeEngineTask.lastScore = staticEvaluateBoard(board);
        activeEngineTask.mateIn = null;
        activeEngineTask.lastPv = '';

        if (nextTask.skill !== undefined) {
            sfWorker.postMessage('setoption name Skill Level value ' + nextTask.skill);
        } else {
            sfWorker.postMessage('setoption name Skill Level value 20');
        }
        sfWorker.postMessage('position fen ' + nextTask.fen);
        sfWorker.postMessage('go depth ' + (nextTask.depth || 10));
    }

    function uciToMoveIndices(uci) {
        if (!uci || uci.length < 4 || uci === '(none)') return null;
        var f = squareNameToIdx(uci.substring(0, 2));
        var t = squareNameToIdx(uci.substring(2, 4));
        var promo = uci.length >= 5 ? uci.charAt(4) : null;
        if (f === null || t === null) return null;
        return { from: f, to: t, promo: promo };
    }

    // Fast Local Minimax Fallback Engine (for offline / 32-bit browsers)
    function findBestMoveLocal(bState, turnCol, depth) {
        var allMoves = [];
        for (var i = 0; i < 64; i++) {
            if (bState[i] && getColor(bState[i]) === turnCol) {
                var lMoves = getLegalMoves(i, bState);
                for (var j = 0; j < lMoves.length; j++) {
                    allMoves.push({ from: i, to: lMoves[j] });
                }
            }
        }
        if (allMoves.length === 0) return null;

        // Order captures first
        allMoves.sort(function(a, b) {
            var capA = bState[a.to] ? (PIECE_VALUES[bState[a.to].toLowerCase()] || 1) : 0;
            var capB = bState[b.to] ? (PIECE_VALUES[bState[b.to].toLowerCase()] || 1) : 0;
            return capB - capA;
        });

        var isMax = (turnCol === 'white');
        var bestMove = allMoves[0];
        var bestScore = isMax ? -9999 : 9999;

        for (var m = 0; m < allMoves.length; m++) {
            var mv = allMoves[m];
            var nextB = bState.slice();
            nextB[mv.to] = nextB[mv.from];
            nextB[mv.from] = '';
            // Auto-queen in simulation
            var p = nextB[mv.to];
            if (p === 'P' && Math.floor(mv.to / 8) === 0) nextB[mv.to] = 'Q';
            if (p === 'p' && Math.floor(mv.to / 8) === 7) nextB[mv.to] = 'q';

            var sc = minimaxLocal(nextB, depth - 1, -10000, 10000, !isMax);
            // Tiny jitter for variety on lower difficulties
            sc += (Math.random() - 0.5) * 0.08;

            if (isMax && sc > bestScore) {
                bestScore = sc;
                bestMove = mv;
            } else if (!isMax && sc < bestScore) {
                bestScore = sc;
                bestMove = mv;
            }
        }
        var uci = idxToSquareName(bestMove.from) + idxToSquareName(bestMove.to);
        return { uci: uci, score: bestScore };
    }

    function minimaxLocal(bState, depth, alpha, beta, isMax) {
        if (depth <= 0) return staticEvaluateBoard(bState);
        var col = isMax ? 'white' : 'black';
        var moves = [];
        for (var i = 0; i < 64; i++) {
            if (bState[i] && getColor(bState[i]) === col) {
                var lm = getMoves(i, bState, true);
                for (var j = 0; j < lm.length; j++) moves.push({ from: i, to: lm[j] });
            }
        }
        if (moves.length === 0) return staticEvaluateBoard(bState);

        if (isMax) {
            var maxEval = -9999;
            for (var m = 0; m < moves.length; m++) {
                var nb = bState.slice();
                nb[moves[m].to] = nb[moves[m].from];
                nb[moves[m].from] = '';
                var ev = minimaxLocal(nb, depth - 1, alpha, beta, false);
                if (ev > maxEval) maxEval = ev;
                if (ev > alpha) alpha = ev;
                if (beta <= alpha) break;
            }
            return maxEval;
        } else {
            var minEval = 9999;
            for (var m2 = 0; m2 < moves.length; m2++) {
                var nb2 = bState.slice();
                nb2[moves[m2].to] = nb2[moves[m2].from];
                nb2[moves[m2].from] = '';
                var ev2 = minimaxLocal(nb2, depth - 1, alpha, beta, true);
                if (ev2 < minEval) minEval = ev2;
                if (ev2 < beta) beta = ev2;
                if (beta <= alpha) break;
            }
            return minEval;
        }
    }

    function runFallbackEngineTask(task) {
        var res = findBestMoveLocal(board, task.turn, 2);
        var sc = res ? res.score : staticEvaluateBoard(board);
        var uci = res ? res.uci : null;
        if (task.callback) task.callback(uci, sc, null, uci || '');
    }

    function evaluateAndClassifyPly(plyIndex, movedColor) {
        var fenNow = getBoardFEN();
        var turnNow = currentPlayer;
        enqueueEngineTask({
            kind: 'eval_position',
            fen: fenNow,
            turn: turnNow,
            depth: 9,
            callback: function(bestUci, scoreWhite, mateIn, pvLine) {
                if (typeof scoreWhite !== 'number') scoreWhite = staticEvaluateBoard(board);
                updateEvalBar(scoreWhite, mateIn);

                var histIdx = plyIndex + 1; // gameHistoryLog[0] is initial board
                if (gameHistoryLog[histIdx]) {
                    gameHistoryLog[histIdx].evalScore = scoreWhite;
                }
                var prevEval = (histIdx > 0 && gameHistoryLog[histIdx - 1]) ? gameHistoryLog[histIdx - 1].evalScore : 0.0;
                var delta = (movedColor === 'white') ? (scoreWhite - prevEval) : (prevEval - scoreWhite);

                var badge = { label: '!', cls: 'badge-good', title: 'Good Move' };
                if (delta >= 0.8) {
                    badge = { label: '!!', cls: 'badge-best', title: 'Brilliant / Best Move' };
                } else if (delta >= -0.35) {
                    badge = { label: '!', cls: 'badge-best', title: 'Best / Solid Move' };
                } else if (delta >= -0.9) {
                    badge = { label: '?!', cls: 'badge-inaccuracy', title: 'Inaccuracy' };
                } else if (delta >= -2.0) {
                    badge = { label: '?', cls: 'badge-mistake', title: 'Mistake' };
                } else {
                    badge = { label: '??', cls: 'badge-blunder', title: 'Blunder' };
                }

                moveClassifications[plyIndex] = badge;

                // Track player stats for Game Over modal
                var isPlayerMove = (currentMode === 'pvp') || (movedColor === playerColor);
                if (isPlayerMove) {
                    if (badge.cls === 'badge-best' || badge.cls === 'badge-good') matchBestCount++;
                    else if (badge.cls === 'badge-mistake') matchMistakes++;
                    else if (badge.cls === 'badge-blunder') matchBlunders++;
                }

                if (pvLine) {
                    document.getElementById('engine-line-text').textContent = 'PV: ' + pvLine.split(' ').slice(0, 5).join(' ');
                }
                renderNotation();
                drawEvaluationGraph();
            }
        });
    }

    function updateEvalBar(scoreWhite, mateIn) {
        var clamped = Math.max(-10, Math.min(10, scoreWhite));
        var pct = 50 + (clamped / 10) * 48;
        evalFill.style.height = pct + '%';

        if (mateIn !== null && mateIn !== undefined) {
            evalScoreLabel.textContent = 'M' + Math.abs(mateIn);
        } else {
            var sign = scoreWhite > 0 ? '+' : '';
            evalScoreLabel.textContent = sign + scoreWhite.toFixed(1);
        }
    }

    function requestAIMove() {
        if (isGameOver || aiThinking) return;
        aiThinking = true;

        var diffMap = {
            '450':  { skill: 0,  depth: 2 },
            '800':  { skill: 3,  depth: 4 },
            '1200': { skill: 7,  depth: 7 },
            '1600': { skill: 13, depth: 10 },
            '2200': { skill: 20, depth: 13 }
        };
        var cfg = diffMap[currentDifficulty] || diffMap['1600'];

        setTimeout(function() {
            if (isGameOver) { aiThinking = false; return; }
            enqueueEngineTask({
                kind: 'ai_move',
                fen: getBoardFEN(),
                turn: currentPlayer,
                skill: cfg.skill,
                depth: cfg.depth,
                callback: function(bestUci) {
                    aiThinking = false;
                    if (isGameOver || currentPlayer === playerColor) return;
                    var parsed = uciToMoveIndices(bestUci);
                    // Verify move is legal; if not, pick via local fallback
                    if (!parsed || getLegalMoves(parsed.from).indexOf(parsed.to) === -1) {
                        var fb = findBestMoveLocal(board, currentPlayer, 2);
                        parsed = fb ? uciToMoveIndices(fb.uci) : null;
                    }
                    if (parsed) {
                        executeMove(parsed.from, parsed.to, parsed.promo || 'q', false);
                    }
                }
            });
        }, 260);
    }

    function triggerBestMoveAnalysis() {
        var fenToAnalyze = getBoardFEN();
        var turnToAnalyze = currentPlayer;
        showToast("Calculating best move...");
        enqueueEngineTask({
            kind: 'best_hint',
            fen: fenToAnalyze,
            turn: turnToAnalyze,
            depth: 11,
            callback: function(bestUci, sc, mateIn, pv) {
                var parsed = uciToMoveIndices(bestUci);
                if (parsed) {
                    reviewBestFrom = parsed.from;
                    reviewBestTo = parsed.to;
                    document.getElementById('engine-line-text').textContent = 'Best: ' + bestUci + (pv ? ' (' + pv.split(' ').slice(0, 4).join(' ') + ')' : '');
                    renderArrows();
                    updateUI();
                }
            }
        });
    }

    function toggleThreatAnalysis(checked) {
        showThreatEnabled = checked;
        if (!checked) {
            threatFrom = null;
            threatTo = null;
            renderArrows();
        } else {
            requestThreatAnalysis();
        }
    }

    function requestThreatAnalysis() {
        if (!showThreatEnabled || isGameOver) return;
        // Flip active turn in FEN to ask engine what opponent threatens to do if they moved now
        var parts = getBoardFEN().split(' ');
        var oppTurn = (currentPlayer === 'white') ? 'b' : 'w';
        parts[1] = oppTurn;
        parts[3] = '-'; // Clear epSquare to avoid invalid FEN
        var threatFen = parts.join(' ');

        enqueueEngineTask({
            kind: 'threat',
            fen: threatFen,
            turn: oppTurn === 'w' ? 'white' : 'black',
            depth: 7,
            callback: function(bestUci) {
                var parsed = uciToMoveIndices(bestUci);
                if (parsed && showThreatEnabled) {
                    threatFrom = parsed.from;
                    threatTo = parsed.to;
                    renderArrows();
                }
            }
        });
    }

    /* =========================================================================
       PERSISTENT DOM UI RENDERER, NOTATION & INTERACTIVE CANVAS GRAPH
       ========================================================================= */
    function updateUI() {
        // Apply Board Theme CSS Variables
        var th = THEMES[currentTheme] || THEMES.slate;
        document.documentElement.style.setProperty('--board-light', th.light);
        document.documentElement.style.setProperty('--board-dark', th.dark);

        var inv = isBoardInverted();
        var checkedKingSq = isKingInCheck(currentPlayer);

        var preSet = {};
        for (var p = 0; p < premoves.length; p++) {
            preSet[premoves[p].from] = true;
            preSet[premoves[p].to] = true;
        }

        // 1. Update 64 Board Squares & Edge Coordinates
        for (var vIdx = 0; vIdx < 64; vIdx++) {
            var lIdx = inv ? (63 - vIdx) : vIdx;
            var sqEl = squareEls[vIdx];
            var r = Math.floor(lIdx / 8);
            var c = lIdx % 8;
            var isLight = ((r + c) % 2 === 0);

            sqEl.className = 'square ' + (isLight ? 'light' : 'dark');
            if (lIdx === selectedIdx) sqEl.classList.add('selected');
            if (lIdx === lastMoveFrom || lIdx === lastMoveTo) sqEl.classList.add('last-move');
            if (lIdx === checkedKingSq) sqEl.classList.add('in-check');
            if (preSet[lIdx]) sqEl.classList.add('premove-sq');
            if (stagedMove && (lIdx === stagedMove.from || lIdx === stagedMove.to)) sqEl.classList.add('staged-sq');
            if (rClickSquares[lIdx]) sqEl.classList.add('rclick-sq');
            if (lIdx === reviewBestFrom || lIdx === reviewBestTo) sqEl.classList.add('review-best');

            // Edge Coordinates
            var vRow = Math.floor(vIdx / 8);
            var vCol = vIdx % 8;
            var rankSpan = sqEl.querySelector('.coord-rank');
            var fileSpan = sqEl.querySelector('.coord-file');
            rankSpan.textContent = (vCol === 0) ? (8 - r) : '';
            fileSpan.textContent = (vRow === 7) ? String.fromCharCode(97 + c) : '';

            // Legal Move Indicators (Dots & Capture Rings)
            var oldInd = sqEl.querySelector('.move-indicator, .capture-indicator');
            if (oldInd) sqEl.removeChild(oldInd);
            if (validMoves.indexOf(lIdx) !== -1) {
                var ind = document.createElement('div');
                var isTargetOccupied = (board[lIdx] !== '') || (board[selectedIdx] && board[selectedIdx].toLowerCase() === 'p' && lIdx === epSquare);
                ind.className = isTargetOccupied ? 'capture-indicator' : 'move-indicator';
                sqEl.appendChild(ind);
            }
        }

        // 2. Sync Persistent Piece DOM Nodes for Smooth Hardware-Accelerated Transitions
        var activeIds = {};
        for (var i = 0; i < 64; i++) {
            var ch = board[i];
            if (!ch) {
                pieceIds[i] = null;
                continue;
            }
            if (!pieceIds[i]) {
                pieceIds[i] = 'p_' + (nextPieceUid++);
            }
            var pid = pieceIds[i];
            activeIds[pid] = true;

            var pNode = pieceDomMap[pid];
            if (!pNode) {
                pNode = document.createElement('div');
                pNode.className = 'piece';
                pNode.dataset.piece = ch;
                pNode.innerHTML = SVGS[ch] || '';
                boardPiecesEl.appendChild(pNode);
                pieceDomMap[pid] = pNode;
            } else if (pNode.dataset.piece !== ch) {
                pNode.dataset.piece = ch;
                pNode.innerHTML = SVGS[ch] || '';
            }

            if (dragState && dragState.moved && dragState.pieceId === pid) {
                continue;
            }

            var visualIdx = inv ? (63 - i) : i;
            var vr = Math.floor(visualIdx / 8);
            var vc = visualIdx % 8;
            pNode.style.transform = 'translate(' + (vc * 100) + '%, ' + (vr * 100) + '%)';
        }

        // Remove captured / obsolete piece DOM nodes
        for (var existingId in pieceDomMap) {
            if (!activeIds[existingId]) {
                var remNode = pieceDomMap[existingId];
                if (remNode && remNode.parentNode) remNode.parentNode.removeChild(remNode);
                delete pieceDomMap[existingId];
            }
        }

        // 3. Player Status Cards, Captured Trays & Material Differential
        var topCol = inv ? 'white' : 'black';
        var botCol = inv ? 'black' : 'white';

        document.getElementById('top-status').classList.toggle('active-turn', !isGameOver && currentPlayer === topCol);
        document.getElementById('bottom-status').classList.toggle('active-turn', !isGameOver && currentPlayer === botCol);

        var whiteLabel = (currentMode === 'cpu' && playerColor !== 'white') ? ('Stockfish (' + currentDifficulty + ')') : 'White (You)';
        var blackLabel = (currentMode === 'cpu' && playerColor !== 'black') ? ('Stockfish (' + currentDifficulty + ')') : 'Black (You)';
        if (currentMode === 'pvp') { whiteLabel = 'White Player'; blackLabel = 'Black Player'; }
        if (isMultiplayerActive) {
            whiteLabel = (multiplayerRole === 'white') ? 'You (White)' : 'Opponent (White)';
            blackLabel = (multiplayerRole === 'black') ? 'You (Black)' : 'Opponent (Black)';
        }

        document.getElementById('top-name').textContent = (topCol === 'white') ? whiteLabel : blackLabel;
        document.getElementById('bottom-name').textContent = (botCol === 'white') ? whiteLabel : blackLabel;

        renderCapturedAndMaterial(topCol, botCol);

        // 4. Confirm Move Tray & FIDE Counter
        confirmTray.style.display = stagedMove ? 'flex' : 'none';
        var curRep = positionCounts[getRepetitionKey()] || 1;
        fideStatusBadge.textContent = '50m: ' + halfMoveClock + '/100 | Rep: ' + curRep + '/3';

        updateClockDisplay();
        renderArrows();
        renderNotation();
    }

    function renderCapturedAndMaterial(topCol, botCol) {
        var wMat = 0, bMat = 0;
        for (var i = 0; i < 64; i++) {
            var p = board[i];
            if (!p) continue;
            var val = PIECE_VALUES[p.toLowerCase()] || 0;
            if (isWhite(p)) wMat += val;
            else bMat += val;
        }
        var diff = wMat - bMat;

        var renderTray = function(caps) {
            var sorted = caps.slice().sort(function(a, b) {
                return (PIECE_VALUES[b.toLowerCase()] || 0) - (PIECE_VALUES[a.toLowerCase()] || 0);
            });
            return sorted.map(function(ch) {
                return '<div class="captured-piece">' + (SVGS[ch] || '') + '</div>';
            }).join('');
        };

        var topCaps = (topCol === 'white') ? capturedWhite : capturedBlack;
        var botCaps = (botCol === 'white') ? capturedWhite : capturedBlack;

        document.getElementById('top-captures').innerHTML = renderTray(topCaps);
        document.getElementById('bottom-captures').innerHTML = renderTray(botCaps);

        var topAdv = (topCol === 'white' && diff > 0) ? ('+' + diff) : ((topCol === 'black' && diff < 0) ? ('+' + Math.abs(diff)) : '');
        var botAdv = (botCol === 'white' && diff > 0) ? ('+' + diff) : ((botCol === 'black' && diff < 0) ? ('+' + Math.abs(diff)) : '');

        document.getElementById('top-mat-adv').textContent = topAdv;
        document.getElementById('bottom-mat-adv').textContent = botAdv;
    }

    function renderNotation() {
        var html = '';
        var activePly = isReviewMode ? (reviewIndex - 1) : (algebraicMoves.length - 1);

        for (var i = 0; i < algebraicMoves.length; i += 2) {
            var moveNum = Math.floor(i / 2) + 1;
            var wMove = algebraicMoves[i] || '';
            var bMove = algebraicMoves[i + 1] || '';
            var wBadge = moveClassifications[i];
            var bBadge = moveClassifications[i + 1];

            var wActive = (i === activePly) ? ' active-ply' : '';
            var bActive = ((i + 1) === activePly) ? ' active-ply' : '';

            var wBadgeHtml = wBadge ? '<span class="move-badge ' + wBadge.cls + '" title="' + wBadge.title + '">' + wBadge.label + '</span>' : '';
            var bBadgeHtml = bBadge ? '<span class="move-badge ' + bBadge.cls + '" title="' + bBadge.title + '">' + bBadge.label + '</span>' : '';

            html += '<div class="move-row">' +
                '<div class="move-num">' + moveNum + '.</div>' +
                '<div class="move-cell' + wActive + '" onclick="jumpToPly(' + (i + 1) + ')"><span>' + wMove + '</span>' + wBadgeHtml + '</div>' +
                (bMove ? '<div class="move-cell' + bActive + '" onclick="jumpToPly(' + (i + 2) + ')"><span>' + bMove + '</span>' + bBadgeHtml + '</div>' : '<div class="move-cell"></div>') +
                '</div>';
        }
        notationPanel.innerHTML = html;
        if (!isReviewMode) {
            notationPanel.scrollTop = notationPanel.scrollHeight;
        }
    }

    function drawEvaluationGraph() {
        var canvas = document.getElementById('eval-graph-canvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var w = canvas.width;
        var h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        // Background & Midline
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();

        var frames = isReviewMode ? reviewGameData : gameHistoryLog;
        if (!frames || frames.length < 2) return;

        var stepX = w / Math.max(1, frames.length - 1);

        // Draw filled evaluation curve
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        for (var i = 0; i < frames.length; i++) {
            var ev = Math.max(-8, Math.min(8, frames[i].evalScore || 0));
            var x = i * stepX;
            var y = (h / 2) - (ev / 8) * (h / 2 - 6);
            ctx.lineTo(x, y);
        }
        ctx.lineTo((frames.length - 1) * stepX, h / 2);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
        ctx.fill();

        // Stroke line
        ctx.beginPath();
        for (var j = 0; j < frames.length; j++) {
            var ev2 = Math.max(-8, Math.min(8, frames[j].evalScore || 0));
            var x2 = j * stepX;
            var y2 = (h / 2) - (ev2 / 8) * (h / 2 - 6);
            if (j === 0) ctx.moveTo(x2, y2);
            else ctx.lineTo(x2, y2);
        }
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Highlight current ply marker
        var curIdx = isReviewMode ? reviewIndex : (frames.length - 1);
        var cx = curIdx * stepX;
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, 0);
        ctx.lineTo(cx, h);
        ctx.stroke();
    }

    // Click on Evaluation Graph to jump to that exact move
    document.getElementById('eval-graph-canvas').addEventListener('click', function(e) {
        var frames = isReviewMode ? reviewGameData : gameHistoryLog;
        if (!frames || frames.length < 2) return;
        var rect = this.getBoundingClientRect();
        var ratio = (e.clientX - rect.left) / rect.width;
        var targetIdx = Math.round(ratio * (frames.length - 1));
        jumpToPly(targetIdx);
    });

    /* =========================================================================
       PRECISION CLOCKS & TIMERS
       ========================================================================= */
    function startTimer() {
        stopTimer();
        if (timeControlSetting === 'unlimited') {
            timerWhite = null;
            timerBlack = null;
            updateClockDisplay();
            return;
        }
        var parts = timeControlSetting.split('+');
        var baseSec = parseInt(parts[0], 10) || 600;
        timeIncrement = parseInt(parts[1], 10) || 0;
        timerWhite = baseSec;
        timerBlack = baseSec;
        lastTickTimestamp = performance.now();
        updateClockDisplay();

        timerInterval = setInterval(function() {
            if (isGameOver || isReviewMode || pendingPromotion) {
                lastTickTimestamp = performance.now();
                return;
            }
            var now = performance.now();
            var dt = (now - lastTickTimestamp) / 1000.0;
            lastTickTimestamp = now;

            if (currentPlayer === 'white') {
                timerWhite = Math.max(0, timerWhite - dt);
                if (timerWhite <= 0) {
                    updateClockDisplay();
                    endGame("Time Out!", "Black wins on time.", 'black');
                    return;
                }
            } else {
                timerBlack = Math.max(0, timerBlack - dt);
                if (timerBlack <= 0) {
                    updateClockDisplay();
                    endGame("Time Out!", "White wins on time.", 'white');
                    return;
                }
            }
            updateClockDisplay();
        }, 100);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function formatTime(sec) {
        if (sec === null || sec === undefined) return '--:--';
        var total = Math.ceil(sec);
        var m = Math.floor(total / 60);
        var s = total % 60;
        if (sec < 10 && sec > 0) {
            return '0:0' + sec.toFixed(1);
        }
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function updateClockDisplay() {
        var inv = isBoardInverted();
        var topCol = inv ? 'white' : 'black';
        var botCol = inv ? 'black' : 'white';

        var topSec = (topCol === 'white') ? timerWhite : timerBlack;
        var botSec = (botCol === 'white') ? timerWhite : timerBlack;

        var topEl = document.getElementById('top-clock');
        var botEl = document.getElementById('bottom-clock');

        topEl.textContent = formatTime(topSec);
        botEl.textContent = formatTime(botSec);

        topEl.classList.toggle('low-time', topSec !== null && topSec < 20);
        botEl.classList.toggle('low-time', botSec !== null && botSec < 20);
    }

        capturedBlack = [];

        epSquare = null;
        halfMoveClock = 0;
        fullMoveNumber = 1;
        positionCounts = {};

        pendingPromotion = null;
        isGameOver = false;
        aiThinking = false;

        if (!isMultiplayerActive) {
            if (playerColorSetting === 'random') {
                playerColor = Math.random() < 0.5 ? 'white' : 'black';
            } else {
                playerColor = playerColorSetting;
            }
        } else {
            playerColor = multiplayerRole;
        }

        openingBadge.textContent = "Starting Position";
        recordHistoryFrame(null, 0.0);
        updateEvalBar(0.0, null);

        // Apply Opening Setup if selected in Settings
        var openingStr = (typeof customOpeningSeq === 'string') ? customOpeningSeq : document.getElementById('set-explorer').value;
        if (openingStr && !isMultiplayerActive) {
            applySANSequence(openingStr);
        }

        startTimer();
        updateUI();
        drawEvaluationGraph();

        if (!isMultiplayerActive && currentMode === 'cpu' && currentPlayer !== playerColor) {
            requestAIMove();
        }
    }

    function applySANSequence(seqStr) {
        var tokens = seqStr.trim().split(/\s+/);
        for (var t = 0; t < tokens.length; t++) {
            var san = tokens[t];
            var found = false;
            for (var i = 0; i < 64 && !found; i++) {
                if (board[i] && getColor(board[i]) === currentPlayer) {
                    var legals = getLegalMoves(i);
                    for (var j = 0; j < legals.length; j++) {
                        var to = legals[j];
                        var isCap = (board[to] !== '') || (board[i].toLowerCase() === 'p' && to === epSquare);
                        var candidateSan = getAlgebraic(i, to, board[i], isCap, null);
                        if (candidateSan === san) {
                            executeMove(i, to, 'q', true);
                            found = true;
                            break;
                        }
                    }
                }
            }
        }
    }

    function endGame(title, subtitle, winnerColor) {
        if (isGameOver) return;
        isGameOver = true;
        stopTimer();
        playSound('gameover');

        document.getElementById('game-over-title').textContent = title;
        document.getElementById('game-over-text').textContent = subtitle;

        // Calculate ELO Rating adjustment in CPU matches
        var eloText = '';
        if (currentMode === 'cpu' && !isMultiplayerActive && algebraicMoves.length >= 2) {
            var aiElo = parseInt(currentDifficulty, 10) || 1600;
            var expected = 1 / (1 + Math.pow(10, (aiElo - playerElo) / 400));
            var actual = (winnerColor === 'draw') ? 0.5 : (winnerColor === playerColor ? 1.0 : 0.0);
            var delta = Math.round(32 * (actual - expected));
            playerElo = Math.max(100, playerElo + delta);
            localStorage.setItem('chessPlayerElo', playerElo);
            document.getElementById('elo-display').textContent = "⭐ " + playerElo;
            var sign = delta >= 0 ? '+' : '';
            eloText = 'Rating: ' + playerElo + ' (' + sign + delta + ')';
        }
        document.getElementById('elo-change-text').textContent = eloText;

        document.getElementById('stat-best').textContent = matchBestCount;
        document.getElementById('stat-mistakes').textContent = matchMistakes;
        document.getElementById('stat-blunders').textContent = matchBlunders;

        // Save match to LocalStorage history
        saveMatchToHistory(title, subtitle);

        gameOverModal.style.display = 'flex';
        updateUI();
    }

    function restoreHistoryFrame(frame) {
        board = frame.board.slice();
        pieceIds = frame.pieceIds ? frame.pieceIds.slice() : new Array(64).fill(null);
        currentPlayer = frame.currentPlayer;
        capturedWhite = frame.capturedWhite.slice();
        capturedBlack = frame.capturedBlack.slice();
        castlingRights = Object.assign({}, frame.castlingRights);
        epSquare = frame.epSquare;
        halfMoveClock = frame.halfMoveClock;
        fullMoveNumber = frame.fullMoveNumber;
        lastMoveFrom = frame.lastMoveFrom;
        lastMoveTo = frame.lastMoveTo;
        updateEvalBar(frame.evalScore || 0.0, null);
    }

    function undoLastTurn() {
        if (isGameOver || isReviewMode || isMultiplayerActive) {
            if (isMultiplayerActive) showToast("Undo is disabled in online matches");
            return;
        }
        var pliesToUndo = (currentMode === 'cpu') ? 2 : 1;
        if (gameHistoryLog.length <= pliesToUndo) {
            showToast("Nothing to undo");
            return;
        }
        for (var i = 0; i < pliesToUndo; i++) {
            gameHistoryLog.pop();
            algebraicMoves.pop();
            moveClassifications.pop();
        }
        var latest = gameHistoryLog[gameHistoryLog.length - 1];
        restoreHistoryFrame(latest);
        selectedIdx = null;
        validMoves = [];
        reviewBestFrom = null;
        reviewBestTo = null;
        updateUI();
        drawEvaluationGraph();
    }

    function resignGame() {
        if (isGameOver || isReviewMode) return;
        var resigner = isMultiplayerActive ? multiplayerRole : (currentMode === 'cpu' ? playerColor : currentPlayer);
        var winner = resigner === 'white' ? 'black' : 'white';
        if (isMultiplayerActive && conn && conn.open) {
            conn.send({ type: 'resign', color: resigner });
        }
        endGame("Resignation", (winner === 'white' ? "White" : "Black") + " wins by resignation.", winner);
    }

    function offerDraw() {
        if (isGameOver || isReviewMode) return;
        if (isMultiplayerActive && conn && conn.open) {
            conn.send({ type: 'draw_offer' });
            showToast("Draw offer sent to opponent");
        } else if (currentMode === 'pvp') {
            document.getElementById('draw-offer-banner').style.display = 'flex';
        } else {
            // Against Stockfish: accept if eval is close to equal
            var curEval = gameHistoryLog[gameHistoryLog.length - 1].evalScore || 0;
            if (Math.abs(curEval) <= 0.6 && algebraicMoves.length >= 20) {
                endGame("Draw Agreed", "Stockfish accepted your draw offer.", 'draw');
            } else {
                showToast("Stockfish declined the draw offer");
            }
        }
    }

    function respondDrawOffer(accept) {
        document.getElementById('draw-offer-banner').style.display = 'none';
        if (accept) {
            if (isMultiplayerActive && conn && conn.open) {
                conn.send({ type: 'draw_accept' });
            }
            endGame("Draw Agreed", "Game drawn by mutual agreement.", 'draw');
        } else {
            if (isMultiplayerActive && conn && conn.open) {
                conn.send({ type: 'draw_decline' });
            }
            showToast("Draw offer declined");
        }
    }

    function openReviewFromEnd() {

    function enterReviewMode(historyFrames) {
        if (!historyFrames || historyFrames.length === 0) return;
        isReviewMode = true;
        reviewGameData = historyFrames.slice();
        reviewIndex = reviewGameData.length - 1;
        gameControls.style.display = 'none';
        reviewControls.style.display = 'flex';
        restoreHistoryFrame(reviewGameData[reviewIndex]);
        updateUI();
        drawEvaluationGraph();
    }

    function reviewStep(delta) {
        if (!isReviewMode && gameHistoryLog.length > 1) {
            enterReviewMode(gameHistoryLog);
        }
        if (!isReviewMode) return;
        reviewIndex = Math.max(0, Math.min(reviewGameData.length - 1, reviewIndex + delta));
        reviewBestFrom = null;
        reviewBestTo = null;
        restoreHistoryFrame(reviewGameData[reviewIndex]);
        updateUI();
        drawEvaluationGraph();
    }

    function jumpToPly(plyIdx) {
        if (!isReviewMode) {
            enterReviewMode(gameHistoryLog);
        }
        reviewIndex = Math.max(0, Math.min(reviewGameData.length - 1, plyIdx));
        reviewBestFrom = null;
        reviewBestTo = null;
        restoreHistoryFrame(reviewGameData[reviewIndex]);
        updateUI();
        drawEvaluationGraph();
    }

    function exitReview() {
        if (!isReviewMode) return;
        isReviewMode = false;
        reviewControls.style.display = 'none';
        gameControls.style.display = 'flex';
        reviewBestFrom = null;
        reviewBestTo = null;
        if (gameHistoryLog.length > 0) {
            restoreHistoryFrame(gameHistoryLog[gameHistoryLog.length - 1]);
        }
        updateUI();
        drawEvaluationGraph();
    }

    function saveMatchToHistory(title, subtitle) {
        if (algebraicMoves.length === 0) return;
        var saved = JSON.parse(localStorage.getItem('chessMatchHistory') || '[]');
        saved.unshift({
            date: new Date().toLocaleString(),
            title: title,
            subtitle: subtitle,
            moves: algebraicMoves.slice(),
            frames: gameHistoryLog.slice()
        });
        if (saved.length > 20) saved.pop();
        try {
            localStorage.setItem('chessMatchHistory', JSON.stringify(saved));
        } catch (e) {}
    }

    /* =========================================================================
       PEERJS ONLINE MULTIPLAYER, SAFE CHAT & ADDRESS BOOK
       ========================================================================= */
    function ensurePeerInitialized(onReady) {
        if (peer && !peer.destroyed) {
            if (peer.open) onReady(peer.id);
            else peer.once('open', onReady);
            return;
        }
        if (typeof Peer === 'undefined') {
            showToast("PeerJS library unavailable offline");
            return;
        }
        peer = new Peer(myPersistentId);
        peer.on('open', function(id) {
            if (onReady) onReady(id);
        });
        peer.on('connection', function(incomingConn) {
            conn = incomingConn;
            multiplayerRole = 'white';
            isMultiplayerActive = true;
            setupConnectionHandlers();
        });
        peer.on('error', function(err) {
            showToast("Peer Error: " + (err.type || "Connection failed"));
        });
    }

    function hostMultiplayer() {
        ensurePeerInitialized(function(id) {
            var inviteUrl = window.location.origin + window.location.pathname + '?join=' + encodeURIComponent(id);
            var infoEl = document.getElementById('mp-info-string');
            infoEl.style.display = 'flex';
            infoEl.innerHTML = '<span>Your Room ID: <strong>' + id + '</strong></span>' +
                '<button class="action-btn" style="flex-grow:0; padding:4px 8px;" onclick="copyInviteLink(\'' + inviteUrl + '\')">🔗 Copy Link</button>';
            showToast("Hosting Room: " + id);
        });
    }

    function copyInviteLink(url) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function() {
                showToast("Invite link copied!");
            });
        }
    }

    function joinMultiplayer(forcedId) {
        var rawInput = forcedId || document.getElementById('mp-id-input').value.trim();
        if (!rawInput) {
            showToast("Enter a Room ID or Invite Link");
            return;
        }
        // Extract ?join= parameter if full link was pasted
        if (rawInput.indexOf('join=') !== -1) {
            var m = rawInput.match(/[?&]join=([^&]+)/);
            if (m && m[1]) rawInput = decodeURIComponent(m[1]);
        }
        ensurePeerInitialized(function() {
            conn = peer.connect(rawInput);
            multiplayerRole = 'black';
            isMultiplayerActive = true;
            setupConnectionHandlers();
        });
    }

    function setupConnectionHandlers() {
        if (!conn) return;
        conn.on('open', function() {
            showToast("Connected to peer! Starting match...");
            document.getElementById('mp-chat-container').style.display = 'flex';
            initGame();
        });
        conn.on('data', function(data) {
            if (!data || !data.type) return;
            if (data.type === 'move') {
                executeMove(data.from, data.to, data.promo || 'q', true);
            } else if (data.type === 'chat') {
                appendChatMessage('Opponent', data.text);
            } else if (data.type === 'resign') {
                var winCol = data.color === 'white' ? 'black' : 'white';
                endGame("Opponent Resigned", "You win by resignation!", winCol);
            } else if (data.type === 'draw_offer') {
                document.getElementById('draw-offer-banner').style.display = 'flex';
            } else if (data.type === 'draw_accept') {
                endGame("Draw Agreed", "Game drawn by mutual agreement.", 'draw');
            } else if (data.type === 'draw_decline') {
                showToast("Opponent declined your draw offer");
            }
        });
        conn.on('close', function() {
            showToast("Peer disconnected");
            isMultiplayerActive = false;
        });
    }

        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            reviewStep(-1);
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            reviewStep(1);
        } else if (e.key === 'f' || e.key === 'F') {
            e.preventDefault();
            toggleManualFlip();
        } else if (e.key === 'Escape') {
            settingsModal.style.display = 'none';
            historyModal.style.display = 'none';
            friendsModal.style.display = 'none';
        }
    });
